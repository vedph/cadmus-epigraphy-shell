<div (keydown.enter)="onEnterKey($event)">
  <!-- id -->
  <mat-form-field>
    <mat-label>ID</mat-label>
    <input matInput [formField]="form.id" />
    @if (
      form.id().getError("required") &&
      (form.id().dirty() || form.id().touched())
    ) {
      <mat-error>ID required</mat-error>
    }
    @if (
      form.id().getError("maxLength") &&
      (form.id().dirty() || form.id().touched())
    ) {
      <mat-error>ID too long</mat-error>
    }
  </mat-form-field>

  <!-- features -->
  <fieldset>
    <legend>features</legend>
    <cadmus-ui-flag-set
      [flags]="featFlags()"
      [checkedIds]="form.features().value()"
      (checkedIdsChange)="onFeatIdsChange($event)"
    />
  </fieldset>

  <!-- description -->
  <div id="editor">
    <ngx-monaco-editor
      [value]="form.description().value()"
      (valueChange)="setFieldFromEditor(form.description, $event)"
      (blur)="form.description().markAsTouched()"
      [language]="'markdown'"
      [options]="editorOptions"
      (editorInitialized)="onEditorInit($event)"
    />
  </div>

  <!-- measurements -->
  <fieldset>
    <legend>measurements</legend>
    <cadmus-mat-physical-measurement-set
      [allowCustomName]="true"
      [nameEntries]="measNameEntries()"
      [unitEntries]="measUnitEntries() || []"
      [dimTagEntries]="measDimTagEntries()"
      [measurements]="form.measurements().value()"
      (measurementsChange)="onMeasurementsChange($event)"
    />
  </fieldset>

  <!-- buttons -->
  <div class="form-row">
    <button
      type="button"
      mat-icon-button
      matTooltip="Discard changes"
      (click)="cancel()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      matTooltip="Accept changes"
      [disabled]="form().invalid() || !form().dirty()"
      (click)="save()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
